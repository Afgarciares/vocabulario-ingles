<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VoKblo 1000</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #111113; --surface: #18181b; --border: #27272a;
      --text-main: #f4f4f5; --text-muted: #a1a1aa;
      --pass: #22c55e; --doubt: #eab308; --fail: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 90px 16px; }
    .app-shell { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px; }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1rem; font-weight: 800; letter-spacing: 1px; color: var(--text-main); text-transform: uppercase; }
    .view { width: 100%; display: none; flex-direction: column; gap: 16px; }
    .view.active { display: flex; }
    .card-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
    h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; }
    p.desc { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.45; }
    button { cursor: pointer; border: none; font-size: 0.95rem; border-radius: 10px; font-weight: 600; }
    button:active { opacity: 0.7; }
    .btn-action { background: var(--text-main); color: var(--bg); padding: 14px; width: 100%; margin-top: 10px; }
    .btn-secondary { background: var(--border); color: var(--text-main); padding: 12px; width: 100%; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 12px; width: 100%; }
    .option-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .btn-chip { background: #1f1f23; border: 1px solid var(--border); color: var(--text-muted); padding: 12px; border-radius: 10px; }
    .btn-chip.active { background: #2a2a30; color: var(--text-main); border-color: var(--text-muted); }
    .study-box { min-height: 270px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 32px 24px; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; position: relative; }
    .counter { position: absolute; top: 16px; right: 16px; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .word-title { font-size: 2.6rem; font-weight: 700; margin-bottom: 12px; }
    .meaning { font-size: 1.5rem; color: var(--text-muted); font-weight: 500; margin-top: 14px; display: none; }
    .input-clean { width: 100%; background: #111113; border: 2px solid var(--border); color: #fff; padding: 14px; border-radius: 10px; font-size: 1.1rem; text-align: center; outline: none; margin-top: 14px; }
    .feedback-icon { font-size: 2rem; font-weight: bold; margin-top: 10px; display: none; }
    .fc-pass { color: var(--pass); } .fc-fail { color: var(--fail); }
    .btn-x-red { background: rgba(239, 68, 68, 0.15); color: var(--fail); border: 2px solid var(--fail); padding: 14px; border-radius: 10px; font-size: 1.2rem; font-weight: bold; width: 100%; margin-top: 10px; }
    .grade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
    .btn-grade { padding: 14px; border-radius: 10px; color: #fff; font-size: 0.9rem; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .metric-card { background: #1c1c20; padding: 16px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
    .metric-num { font-size: 2rem; font-weight: 700; }
    .metric-sub { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-top: 6px; }
    .search-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-main); margin-bottom: 16px; font-size: 1rem; }
    .dict-list { max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .dict-item { background: var(--surface); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; }
    .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: rgba(17,17,19,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; max-width: 440px; margin: 0 auto; z-index: 10; }
    .nav-btn { background: none; color: var(--text-muted); font-size: 0.85rem; padding: 10px 24px; border-radius: 8px; transition: all 0.2s; }
    .nav-btn.active { color: var(--text-main); background: #222226; font-weight: 700; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">VoKblo 1000</div>
    </header>

    <!-- PRÁCTICA -->
    <main id="v-daily" class="view active">
      <div class="card-panel" id="resumePanel" style="display: none; border-color: var(--pass);">
        <h2>Tienes un test en progreso</h2>
        <p class="desc" id="resumeText">Estás en la palabra X.</p>
        <button class="btn-action" style="background: var(--pass); color: #fff;" onclick="resumeDiagnostic()">Continuar Diagnóstico</button>
      </div>

      <div class="card-panel">
        <h2>Configurar Práctica</h2>
        <label style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; display: block;">DIRECCIÓN DEL IDIOMA</label>
        <div class="option-row">
          <button id="dir-en-es" class="btn-chip active" onclick="setDirection('en-es')">Inglés → Español</button>
          <button id="dir-es-en" class="btn-chip" onclick="setDirection('es-en')">Español → Inglés</button>
        </div>
        <label style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; display: block;">MÉTODO DE RESPUESTA</label>
        <div class="option-row">
          <button id="m-flash" class="btn-chip active" onclick="setMethod('flash')">Flashcard</button>
          <button id="m-type" class="btn-chip" onclick="setMethod('type')">Escritura</button>
        </div>
        <button class="btn-action" onclick="startDailySession()">Iniciar Rutina Diaria</button>
        <button class="btn-secondary" style="margin-top:10px;" onclick="startDiagnosticSession()">Nuevo Test Diagnóstico</button>
      </div>
    </main>

    <!-- ESTUDIO -->
    <section id="v-study" class="view">
      <div class="study-box">
        <div id="studyCounter" class="counter">1 / 1000</div>
        <div id="cardPrompt" class="word-title">Word</div>
        <div id="cardAnswer" class="meaning">Significado</div>
        <div id="visualFeedback" class="feedback-icon"></div>
        <div id="writeZone" style="width: 100%; display: none;">
          <input type="text" id="typeInput" class="input-clean" placeholder="Escribe tu respuesta..." autocomplete="off">
          <button id="btnSubmitWord" class="btn-action" onclick="verifyTyping()">Comprobar</button>
        </div>
        <button id="btnRevealFlash" class="btn-outline" style="margin-top: 20px;" onclick="revealCard()">Ver Respuesta</button>
      </div>

      <button id="btnSkipX" class="btn-x-red" onclick="gradeAnswer('fail')">✕ No la sé</button>

      <div id="gradeControls" class="grade-grid" style="display: none;">
        <button class="btn-grade" style="background: #713f12; border: 1px solid var(--doubt);" onclick="gradeAnswer('doubt')">Duda (?)</button>
        <button class="btn-grade" style="background: #14532d; border: 1px solid var(--pass);" onclick="gradeAnswer('pass')">La sé (✓)</button>
      </div>
      <button id="btnNextWord" class="btn-action" style="display: none;" onclick="advanceWord()">Siguiente Palabra</button>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
        <button class="btn-secondary" onclick="goBackCard()">← Volver atrás</button>
        <button class="btn-secondary" onclick="exitStudy()">Guardar y salir</button>
      </div>
    </section>

    <!-- PROGRESO -->
    <section id="v-progress" class="view">
      <div class="card-panel">
        <h2>Progreso y Auditoría</h2>
        <div class="metric-grid">
          <div class="metric-card"><div class="metric-num" id="pMastered" style="color: var(--pass);">0</div><div class="metric-sub">Dominadas</div></div>
          <div class="metric-card"><div class="metric-num" id="pDoubt" style="color: var(--doubt);">0</div><div class="metric-sub">Por repasar</div></div>
          <div class="metric-card" style="grid-column: span 2;"><div class="metric-num" id="pTotalPct">0%</div><div class="metric-sub">Avance Total</div></div>
        </div>
        <button class="btn-action" onclick="exportPDFReport()">Descargar reporte en PDF</button>
      </div>
      <div class="card-panel">
        <h2>Evaluación Mixta Semanal</h2>
        <button class="btn-secondary" onclick="startBiweeklyExam()">Tomar evaluación mixta</button>
      </div>
    </section>

    <!-- DICCIONARIO -->
    <section id="v-dict" class="view">
      <div class="card-panel">
        <h2>Diccionario</h2>
        <input type="text" id="searchDict" class="search-box" placeholder="Buscar palabra..." onkeyup="filterDict()">
        <div id="dictList" class="dict-list"></div>
      </div>
    </section>
  </div>

  <nav class="nav-bottom">
    <button id="nav-daily" class="nav-btn active" onclick="switchTab('v-daily')">Práctica</button>
    <button id="nav-progress" class="nav-btn" onclick="switchTab('v-progress')">Progreso</button>
    <button id="nav-dict" class="nav-btn" onclick="switchTab('v-dict')">Diccionario</button>
  </nav>

  <script type="module">
    let vocabulary = [];
    import('./palabras.js')
      .then(module => {
        vocabulary = module.words;
        initializeApp();
      })
      .catch(err => {
        alert("Error cargando palabras.js. Verifica que el archivo exista en GitHub.");
      });

    window.studyMethod = 'flash'; window.studyDirection = 'en-es'; window.studyQueue = []; window.queueIdx = 0; window.sessionMode = '';
    window.advanceTimeout = null;

    // Se cambió la key de localStorage para reiniciar de forma limpia cualquier dato corrupto previo
    function getStore() {
      try { return JSON.parse(localStorage.getItem('vokblo_data')) || { words: {}, diagIndex: 0 }; } 
      catch(e) { return { words: {}, diagIndex: 0 }; }
    }
    function saveStore(store) { localStorage.setItem('vokblo_data', JSON.stringify(store)); }
    function saveWordStatus(id, status) {
      var s = getStore(); s.words[id] = status; saveStore(s);
    }

    function initializeApp() {
      var s = getStore();
      if (s.diagIndex > 0 && s.diagIndex < vocabulary.length) {
        document.getElementById('resumePanel').style.display = 'block';
        document.getElementById('resumeText').innerText = "Estás en la palabra " + (s.diagIndex + 1) + " de " + vocabulary.length + ".";
      }
      window.renderDictionary();
    }

    window.switchTab = function(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('nav-' + viewId.replace('v-', '')).classList.add('active');
      if (viewId === 'v-dict') window.renderDictionary();
      if (viewId === 'v-progress') window.updateMetrics();
    }

    window.setMethod = function(m) {
      window.studyMethod = m;
      document.getElementById('m-flash').classList.toggle('active', m === 'flash');
      document.getElementById('m-type').classList.toggle('active', m === 'type');
    }
    window.setDirection = function(d) {
      window.studyDirection = d;
      document.getElementById('dir-en-es').classList.toggle('active', d === 'en-es');
      document.getElementById('dir-es-en').classList.toggle('active', d === 'es-en');
    }

    window.startDailySession = function() {
      var store = getStore();
      var review = vocabulary.filter(w => store.words[w.id] === 'doubt' || store.words[w.id] === 'fail');
      var newWords = vocabulary.filter(w => !store.words[w.id]).slice(0, 20);
      window.studyQueue = review.concat(newWords);
      if (window.studyQueue.length === 0) { alert("¡Al día! No hay palabras pendientes."); return; }
      window.sessionMode = 'daily'; window.queueIdx = 0; window.initStudyUI();
    }

    window.startDiagnosticSession = function() {
      if(confirm("Esto reiniciará tu progreso de diagnóstico a la palabra 1. ¿Seguro?")) {
        var s = getStore(); s.diagIndex = 0; saveStore(s);
        window.studyQueue = vocabulary.slice(); window.sessionMode = 'diagnostic'; window.queueIdx = 0; window.initStudyUI();
      }
    }

    window.resumeDiagnostic = function() {
      var s = getStore();
      window.studyQueue = vocabulary.slice(); window.sessionMode = 'diagnostic'; window.queueIdx = s.diagIndex || 0;
      window.initStudyUI();
    }
    
    window.startBiweeklyExam = function() {
      window.studyQueue = vocabulary.slice().sort(() => 0.5 - Math.random()).slice(0, 30);
      window.sessionMode = 'exam'; window.queueIdx = 0; window.initStudyUI();
    }

    window.initStudyUI = function() { window.switchTab('v-study'); window.loadCard(); }

    window.loadCard = function() {
      clearTimeout(window.advanceTimeout);
      if (window.queueIdx >= window.studyQueue.length) {
        alert("¡Sesión completada!");
        if (window.sessionMode === 'diagnostic') { var s = getStore(); s.diagIndex = 0; saveStore(s); }
        window.exitStudy(); return;
      }
      var item = window.studyQueue[window.queueIdx];
      document.getElementById('studyCounter').innerText = (window.queueIdx + 1) + " / " + window.studyQueue.length;
      document.getElementById('cardPrompt').innerText = window.studyDirection === 'en-es' ? item.en : item.es;
      document.getElementById('cardAnswer').innerText = window.studyDirection === 'en-es' ? item.es : item.en;
      
      document.getElementById('cardAnswer').style.display = 'none';
      document.getElementById('visualFeedback').style.display = 'none';
      document.getElementById('gradeControls').style.display = 'none';
      document.getElementById('btnNextWord').style.display = 'none';
      document.getElementById('btnSkipX').style.display = 'block';

      if (window.studyMethod === 'type') {
        document.getElementById('writeZone').style.display = 'block';
        document.getElementById('btnRevealFlash').style.display = 'none';
        var inp = document.getElementById('typeInput');
        inp.value = ''; inp.disabled = false;
        document.getElementById('btnSubmitWord').style.display = 'block';
      } else {
        document.getElementById('writeZone').style.display = 'none';
        document.getElementById('btnRevealFlash').style.display = 'block';
      }
    }

    window.revealCard = function() {
      document.getElementById('cardAnswer').style.display = 'block';
      document.getElementById('btnRevealFlash').style.display = 'none';
      document.getElementById('gradeControls').style.display = 'grid';
      document.getElementById('btnSkipX').style.display = 'none';
    }

    window.verifyTyping = function() {
      var item = window.studyQueue[window.queueIdx];
      var userVal = document.getElementById('typeInput').value.toLowerCase().trim();
      var target = window.studyDirection === 'en-es' ? item.es : item.en;
      var matched = target.toLowerCase().includes(userVal) && userVal.length > 1;

      document.getElementById('typeInput').disabled = true;
      document.getElementById('btnSubmitWord').style.display = 'none';
      document.getElementById('btnSkipX').style.display = 'none';
      document.getElementById('cardAnswer').style.display = 'block';
      document.getElementById('btnNextWord').style.display = 'block';

      var fb = document.getElementById('visualFeedback');
      fb.style.display = 'block';
      
      if (matched) { fb.className = 'feedback-icon fc-pass'; fb.innerText = '✓'; saveWordStatus(item.id, 'pass'); } 
      else { fb.className = 'feedback-icon fc-fail'; fb.innerText = '✕'; saveWordStatus(item.id, 'fail'); }

      if (window.sessionMode === 'diagnostic') window.saveDiagnosticProgress();
    }

    window.gradeAnswer = function(status) {
      var item = window.studyQueue[window.queueIdx];
      saveWordStatus(item.id, status);
      var fb = document.getElementById('visualFeedback');
      fb.style.display = 'block';
      fb.className = status === 'pass' ? 'feedback-icon fc-pass' : 'feedback-icon fc-fail';
      fb.innerText = status === 'pass' ? '✓' : '✕';
      if (window.sessionMode === 'diagnostic') window.saveDiagnosticProgress();
      window.advanceTimeout = setTimeout(window.advanceWord, 400);
    }

    window.saveDiagnosticProgress = function() { var s = getStore(); s.diagIndex = window.queueIdx + 1; saveStore(s); }
    window.advanceWord = function() { window.queueIdx++; window.loadCard(); }

    window.goBackCard = function() {
      clearTimeout(window.advanceTimeout);
      if (window.queueIdx > 0) {
        window.queueIdx--;
        if (window.sessionMode === 'diagnostic') { var s = getStore(); s.diagIndex = window.queueIdx; saveStore(s); }
        window.loadCard();
      } else { alert("Esta es la primera palabra."); }
    }

    window.exitStudy = function() { window.switchTab('v-daily'); initializeApp(); }

    // Función de métricas corregida y ampliada
    window.updateMetrics = function() {
      var s = getStore().words;
      var pass = 0, doubt = 0;
      vocabulary.forEach(w => { 
        if(s[w.id] === 'pass') pass++; 
        else if(s[w.id] === 'doubt' || s[w.id] === 'fail') doubt++; 
      });
      
      var totalStudied = pass + doubt;
      var pct = vocabulary.length > 0 ? Math.round((totalStudied / vocabulary.length) * 100) : 0;

      document.getElementById('pMastered').innerText = pass;
      document.getElementById('pDoubt').innerText = doubt;
      document.getElementById('pTotalPct').innerText = pct + '%';
    }

    window.renderDictionary = function(filter = '') {
      var s = getStore().words, listEl = document.getElementById('dictList'); listEl.innerHTML = '';
      var q = filter.toLowerCase();
      vocabulary.filter(w => w.en.toLowerCase().includes(q) || w.es.toLowerCase().includes(q)).forEach(w => {
        var c = s[w.id] === 'pass' ? 'var(--pass)' : (s[w.id] === 'doubt' || s[w.id] === 'fail' ? 'var(--fail)' : '#a1a1aa');
        listEl.insertAdjacentHTML('beforeend', `<div class="dict-item"><div><div style="font-weight:600">${w.en}</div><div style="font-size:0.9rem; color:var(--text-muted)">${w.es}</div></div><div class="status-dot" style="background:${c}"></div></div>`);
      });
    }
    window.filterDict = function() { window.renderDictionary(document.getElementById('searchDict').value); }

    window.exportPDFReport = function() {
      var { jsPDF } = window.jspdf; var doc = new jsPDF();
      doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("REPORTE VOKBLO 1000", 14, 20);
      doc.setFontSize(10); doc.setFont("helvetica", "normal"); doc.text("Fecha: " + new Date().toLocaleDateString(), 14, 28);
      var s = getStore().words, badList = [];
      vocabulary.forEach(w => { if(s[w.id] === 'doubt' || s[w.id] === 'fail') badList.push(w); });
      doc.text("Palabras por repasar: " + badList.length, 14, 36); doc.line(14, 40, 196, 40);
      var y = 50;
      badList.forEach((w, i) => {
        if (y > 275) { doc.addPage(); y = 20; }
        doc.text((i + 1) + ". " + w.en + " - " + w.es, 14, y); y += 6;
      });
      doc.save("VoKblo_Reporte.pdf");
    }
  </script>
</body>
</html>
